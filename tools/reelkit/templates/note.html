<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Gaegu';font-weight:700;src:url('{{FONTDIR_URI}}/Gaegu-Bold.ttf')}
@font-face{font-family:'Noto Sans KR';font-weight:700;src:url('{{FONTDIR_URI}}/NotoSansKR-Bold.otf')}
:root{--bg:#2F4F3E;--paper:#FFF8E7;--rule:#E4DCC6;--margin:#D9796A;--ink:#1E1E1E;--hl:#F2C94C;--foot-note:#B23A2B;--bar:#B08D46}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#nt-root{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--bg);overflow:hidden;
 font-family:'Gaegu','Noto Sans KR',sans-serif;font-weight:700;color:var(--ink)}
#nt-bar{position:absolute;left:0;top:0;height:14px;width:0;background:var(--bar)}
#nt-paper{position:absolute;left:50px;top:150px;width:980px;height:{{PAPER_H}}px;background:var(--paper);border-radius:16px;
 box-shadow:0 14px 28px rgba(0,0,0,.4);
 background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 72px,var(--rule) 72px,var(--rule) 74px);
 background-position:0 200px}
#nt-paper .margin{position:absolute;left:120px;top:0;bottom:0;width:4px;background:var(--margin);opacity:.7}
#nt-paper .rings{position:absolute;top:-42px;left:60px;right:60px;display:flex;justify-content:space-between}
#nt-paper .ring{width:34px;height:86px;border:8px solid #C8C8C8;border-radius:20px;border-bottom-color:transparent;
 box-sizing:border-box;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
/* 글자는 전부 안전영역 안(y 270~1470, 오른쪽 150px 여백)에 놓인다: 흐름 영역은 종이 안쪽 100px(화면 150px)에서 시작한다 */
#nt-flow{position:absolute;left:100px;top:{{FLOW_TOP}}px;width:780px;display:flex;flex-direction:column;gap:{{FLOW_GAP}}px}
.title{font-size:100px;line-height:1.02;display:flex;flex-direction:column}
.title .tl{white-space:nowrap}
.title .w{display:inline-block}
.title .hl{background:linear-gradient(transparent 52%,var(--hl) 52%);padding:0 6px}
.box{border:7px solid var(--c);border-radius:22px;overflow:hidden;background:#FFFDF6;--c:#2F4F3E}
.box.c-green{--c:#2F4F3E}
.box.c-gold{--c:#8A6B2C}
.box .head{display:flex;align-items:baseline;gap:22px;padding:2px 30px 0;background:var(--c);color:#fff;font-size:72px;white-space:nowrap}
.box .head small{font-size:50px;color:#F2E2B8}
.box ul{margin:0;padding:8px 30px 12px;list-style:none;font-size:60px;line-height:1.0}
.box li{display:flex;align-items:center;gap:14px;word-break:keep-all}
.box li .ck{flex:0 0 auto;width:46px;height:46px;opacity:0;color:var(--c)}
.box li .it{flex:0 1 auto;min-width:0;display:inline-block}
.fnote{font-size:58px;color:var(--foot-note);white-space:nowrap}
.fnote .w{display:inline-block}
#nt-foot{position:absolute;left:100px;width:780px;bottom:{{FOOT_BOTTOM}}px;display:flex;flex-direction:column;
 font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:36px;line-height:1.3;text-align:center}
#nt-foot .basis{color:#4A4A4A}
#nt-foot .acct{color:#2F4F3E}
</style></head><body>
<div id="nt-root">
<div id="nt-bar"></div>
<div id="nt-paper">
 <div class="margin"></div>
 <div class="rings">{{RINGS}}</div>
 <div id="nt-flow">{{FLOW}}</div>
 <div id="nt-foot">{{FOOT}}</div>
</div>
</div>
<script>
const T={{TOTAL}};
function ease(p){return p<0?0:p>1?1:1-Math.pow(1-p,2)}
window.renderAt=function(t){
 document.querySelectorAll('.w').forEach(el=>{
  const s=+el.dataset.s,d=+el.dataset.d,p=ease((t-s)/d),a=el.dataset.a;
  if(a==='write'){
   el.style.clipPath='inset(-20% '+((1-p)*100)+'% -20% -2%)';
   el.style.opacity=p>0?1:0;
   const li=el.closest('li'); if(li){const ck=li.querySelector('.ck'); if(ck) ck.style.opacity=p>0?1:0;}
  } else if(a==='pop'){
   el.style.opacity=p; el.style.transform='scale('+(0.94+0.06*p)+')';
  } else {
   el.style.opacity=p; el.style.transform='translateY('+(16*(1-p))+'px)';
  }
 });
 document.getElementById('nt-bar').style.width=(Math.min(Math.max(t/T,0),1)*100)+'%';
};
</script></body></html>
